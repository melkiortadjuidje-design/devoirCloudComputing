<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast food by Melkior_grill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="traitement.php" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label><b>Noms :</b></label>
                <input type="text" name="nom" placeholder="Ton nom" required>
            </div>

            <div class="form-group">
                <label><b>Prénoms :</b></label>
                <input type="text" name="prenom" placeholder="Ton prénom">
            </div>

            <div class="form-group">
                <label><b>Mot de passe :</b></label>
                <div class="mdp-wrapper">
                    <input type="password" id="mdp" name="mdp" required>
                    <span class="eye-icon" onclick="toggleMdp()">👁</span>
                </div>
            </div>

            <div class="form-group">
                <label><b>Email :</b></label>
                <input type="email" name="mail" placeholder="votre_email@gmail.com" required>
            </div>

            <div class="form-group">
                <label><b>Âge :</b></label>
                <input type="number" name="age" min="0" max="120" required>
            </div>

            <div class="form-group">
                <label><b>Date de naissance :</b></label>
                <input type="date" name="naissance" required>
            </div>

            <div class="form-group">
                <label><b>Photo :</b></label>
                <input type="file" name="avatar" required>
            </div>

            <div class="form-group radio">
                <b>Sexe :</b>
                <label class="radio-label">
                    <input type="radio" name="sexe" value="Masculin"> Masculin
                </label>
                <label class="radio-label">
                    <input type="radio" name="sexe" value="Féminin"> Féminin
                </label>
            </div>

            <input type="hidden" name="token" value="MELKIOR">

            <div class="accepte">
                <strong><u>J'accepte les conditions d'utilisation</u></strong>
                <input type="checkbox" name="accepte" value="oui" required>
            </div>

            <input type="submit" value="Envoyer" onclick="alert('Votre formulaire a bien été envoyé')">

        </form>
    </div>

    <script>
        function toggleMdp() {
            const input = document.getElementById('mdp');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
